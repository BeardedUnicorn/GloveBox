[package]
name = "glovebox"
version = "1.0.0"
description = "Learn to glove: a webcam light-show trainer for LED glove flow"
authors = ["Mike Herold"]
license = "MIT"
repository = "https://github.com/BeardedUnicorn/GloveBox"
edition = "2024"
rust-version = "1.93"

[lib]
# The `_lib` suffix keeps the lib's name apart from the binary's (cargo#8519)
name = "glovebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[features]
# Failpoints (fail_point!) are no-ops unless this is on: the coverage run
# turns it on to reach error paths no cheap real fault can.
failpoints = ["fail/failpoints"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.6.0", features = ["sqlite"] }
tauri-plugin-dialog = "2.8.4"
tauri-plugin-fs = "2.7.1"
fail = "0.5"

# Desktop only: a phone updates through its store or its APK instead
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2.14.1"

[dev-dependencies]
tauri = { version = "2.12", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
