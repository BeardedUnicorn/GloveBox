[package]
name = "glovebox"
version = "0.1.0"
description = "Learn to glove: a webcam light-show trainer for LED glove flow"
authors = ["Mike Herold"]
license = "MIT"
repository = "https://github.com/BeardedUnicorn/GloveBox"
edition = "2024"
rust-version = "1.93"

[lib]
# The `_lib` suffix keeps the lib's name apart from the binary's (cargo#8519)
name = "glovebox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]


[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
